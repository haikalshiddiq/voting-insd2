<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Voting InSD2</title><style>:root{--navy:#102f56;--blue:#266b9c;--teal:#00a6a6;--bg:#f5f8fc;--card:#fff;--text:#172033;--muted:#65748b;--line:#dbe5ef;--ok:#1f9d55;--danger:#ca3d3d;--shadow:0 18px 45px rgba(16,47,86,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 4%,rgba(0,166,166,.12),transparent 28%),radial-gradient(circle at 92% 14%,rgba(38,107,156,.14),transparent 34%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}header{position:relative;overflow:hidden;background:linear-gradient(125deg,var(--navy),var(--blue));color:#fff;padding:26px 22px}header:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff12;right:-50px;top:-110px;animation:float 9s ease-in-out infinite}.header-inner,.wrap{max-width:1120px;margin:auto}.header-inner{display:flex;justify-content:space-between;gap:18px;align-items:center;position:relative;z-index:1}.clock{text-align:right;font-variant-numeric:tabular-nums}.clock b{display:block;font-size:18px}.wrap{padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:var(--shadow);animation:rise .48s ease both}.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.step{padding:10px;border-radius:10px;background:#eaf0f6;color:var(--muted);font-weight:700;text-align:center}.step.on{background:linear-gradient(135deg,var(--teal),#168bb0);color:#fff}.countdown{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.timebox{min-width:74px;text-align:center;padding:9px;background:#eef6f8;border-radius:12px}.timebox b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.notice{padding:12px;border-radius:12px;background:#fff7df;border:1px solid #eed58e}.actions{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:11px}.candidate{position:relative;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.2s;background:linear-gradient(145deg,var(--card),rgba(0,166,166,.025))}.candidate:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(16,47,86,.12)}.candidate:has(input:checked){border-color:var(--teal);box-shadow:0 0 0 4px rgba(0,166,166,.18)}.candidate:has(input:checked):after{content:'✓';position:absolute;right:10px;top:9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;animation:pop .25s}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.userchip{padding:8px 12px;border-radius:999px;background:#e9f8f7;color:#08716f;font-weight:700}input,button{font:inherit;padding:10px 12px;border:1px solid #bccbd9;border-radius:9px}input[type=text],input[type=password]{width:100%}button{cursor:pointer;background:#fff;transition:.16s}.primary{background:linear-gradient(135deg,var(--teal),#087f9d);color:#fff;border:0}.danger{color:#fff;background:linear-gradient(135deg,#d94b4b,#b52f2f);border:0}.ghost{background:transparent}button:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(16,47,86,.13)}button:disabled{opacity:.5;cursor:not-allowed;transform:none}.muted{color:var(--muted)}.success{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,#35b96d,var(--teal));color:#fff;font-size:40px;animation:pop .4s}.row{display:grid;grid-template-columns:240px 1fr 58px;gap:10px;align-items:center;padding:10px;margin:7px 0;border:1px solid var(--line);border-radius:11px}.bar{height:24px;background:#e7edf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#4f8bd6);animation:grow .8s ease both}@keyframes rise{from{opacity:0;transform:translateY(18px)}}@keyframes pop{from{opacity:0;transform:scale(.45)}}@keyframes float{50%{transform:translate(-18px,14px)}}@keyframes grow{from{width:0}}@media(max-width:680px){.header-inner{align-items:flex-start;flex-direction:column}.clock{text-align:left}.stepper{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(prefers-color-scheme:dark){:root{--bg:#0f1722;--card:#172132;--text:#edf3fa;--muted:#a8b3c3;--line:#334155}.step{background:#26364b}.timebox{background:#20364a}.notice{background:#3d321a;border-color:#66572d}.userchip{background:#123e46;color:#9ce5df}.bar{background:#2a384c}}</style></head><body><header><div class="header-inner"><div><h1>Dashboard Admin Voting</h1><p>Pantau partisipasi dan kendalikan proses pemilihan.</p></div><div class="clock"><span>Waktu server WIB</span><b id="serverClock">--:--:--</b></div></div></header><main class="wrap"><div class="card"><label><b>ADMIN_KEY</b></label><input id="key" type="password" autocomplete="current-password" placeholder="Masukkan ADMIN_KEY"><div class="actions"><button id="load" class="primary">Buka dashboard</button></div></div><div id="app"></div></main><script>let offset=0,last;const E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function tick(){let n=new Date(Date.now()+offset);serverClock.textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(n)}setInterval(tick,1000);tick();async function api(method,body){let r=await fetch('/api/admin',{method,headers:{'content-type':'application/json','x-admin-key':key.value},body:body?JSON.stringify(body):null}),j=await r.json();if(!r.ok)throw Error(j.error);return j}async function draw(){try{let d=await api('GET');last=d;offset=Date.parse(d.serverTime)-Date.now();app.innerHTML=`<div class="grid"><div class="card"><span class="muted">Eligible</span><h2>${d.totalEligible}</h2></div><div class="card"><span class="muted">Sesi diredeem</span><h2>${d.redeemed}</h2></div><div class="card"><span class="muted">Suara masuk</span><h2>${d.used}</h2></div><div class="card"><span class="muted">Partisipasi</span><h2>${(100*d.used/d.totalEligible).toFixed(1)}%</h2></div></div><div class="card"><div class="toolbar"><div><h2>Putaran ${d.round}</h2><span class="userchip">${d.ended?'Berakhir otomatis':d.open?'Voting dibuka':'Voting ditutup'}</span></div><div class="actions"><button id="toggle" class="${d.open?'danger':'primary'}" ${d.ended?'disabled':''}>${d.open?'Tutup':'Buka'} voting</button>${d.tied.length>1&&d.tied[0].votes?'<button id="r2">Mulai putaran kedua</button>':''}</div></div><div class="notice"><b>Deadline:</b> Rabu, 11 November 2026 pukul 20.00 WIB. Setelah waktu ini server menolak redeem dan suara baru.</div><h3>Hasil sementara</h3>${d.results.map(x=>`<div class="row"><b>${E(x.name)}</b><div class="bar"><i style="width:${d.used?100*x.votes/d.used:0}%"></i></div><b>${x.votes}</b></div>`).join('')}<h3>Reset sesi NIM</h3><p class="muted">Hanya berlaku jika mahasiswa belum mengirim suara.</p><div class="actions"><input id="nim" placeholder="Masukkan NIM"><button id="reset">Reset sesi</button></div></div>`;toggle.onclick=()=>act({action:'setOpen',value:!d.manualOpen});reset.onclick=()=>{if(confirm('Reset sesi NIM ini?'))act({action:'resetNim',nim:nim.value.trim()})};if(window.r2)r2.onclick=()=>{if(confirm('Mulai putaran kedua untuk kandidat seri?'))act({action:'startRound2',candidates:d.tied.map(x=>x.nim)})}}catch(e){alert(e.message)}}async function act(b){await api('POST',b);draw()}load.onclick=draw;</script></body></html>
