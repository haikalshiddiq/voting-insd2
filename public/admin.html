<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Voting</title><style>body{font:15px system-ui;max-width:1000px;margin:auto;padding:20px}input,button{padding:8px;margin:4px}.row{display:grid;grid-template-columns:260px 1fr 50px;gap:8px;margin:8px}.bar{background:#ddd}.bar i{display:block;height:20px;background:#00a6a6}</style></head><body><h1>Admin Voting InSD2</h1><input id="key" type="password" placeholder="ADMIN_KEY"><button id="load">Muat</button><div id="app"></div><script>async function api(method,body){let r=await fetch('/api/admin',{method,headers:{'content-type':'application/json','x-admin-key':key.value},body:body?JSON.stringify(body):null}),j=await r.json();if(!r.ok)throw Error(j.error);return j}async function draw(){try{let d=await api('GET');app.innerHTML=`<p>Putaran ${d.round} · ${d.open?'Dibuka':'Ditutup'} · Redeem ${d.redeemed}/22 · Suara ${d.used}</p><button id="toggle">${d.open?'Tutup':'Buka'} voting</button>${d.tied.length>1&&d.tied[0].votes?'<button id="r2">Mulai putaran kedua</button>':''}<p><input id="nim" placeholder="NIM untuk reset"><button id="reset">Reset redeem</button></p>${d.results.map(x=>`<div class="row"><b>${x.name}</b><div class="bar"><i style="width:${d.used?100*x.votes/d.used:0}%"></i></div><b>${x.votes}</b></div>`).join('')}`;toggle.onclick=()=>act({action:'setOpen',value:!d.open});reset.onclick=()=>act({action:'resetNim',nim:nim.value});if(window.r2)r2.onclick=()=>act({action:'startRound2',candidates:d.tied.map(x=>x.nim)})}catch(e){alert(e.message)}}async function act(b){await api('POST',b);draw()}load.onclick=draw;</script></body></html>
