<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Voting</title><style>:root{--n:#17365d;--a:#00a6a6;--bg:#f3f7fb;--c:#fff;--t:#172033;--m:#667085;--l:#d8e2ec}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 8%,#00a6a61c,transparent 30%),radial-gradient(circle at 90% 18%,#4f8bd622,transparent 34%),var(--bg);color:var(--t);font:15px/1.5 system-ui;overflow-x:hidden}header{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--n),#2873a8);color:#fff;padding:28px}header:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff12;right:-60px;top:-110px;animation:float 8s ease-in-out infinite}.wrap{max-width:1080px;margin:auto;padding:18px}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 18px 46px #17365d16;animation:rise .55s ease both}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}.cand{position:relative;border:2px solid var(--l);border-radius:12px;padding:13px;transition:.2s;cursor:pointer}.cand:hover{transform:translateY(-4px);box-shadow:0 10px 24px #17365d1c}.cand:has(input:checked){border-color:var(--a);box-shadow:0 0 0 4px #00a6a62e}.cand:has(input:checked):after{content:'✓';position:absolute;right:10px;top:9px;background:var(--a);color:#fff;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;animation:pop .25s}input,button{font:inherit;padding:10px;border:1px solid var(--l);border-radius:8px}input[type=text],input[type=password]{width:100%}button{cursor:pointer;transition:.16s}.primary,#load{background:linear-gradient(135deg,var(--a),#087e9d);color:#fff;border:0}button:hover{transform:translateY(-2px);box-shadow:0 8px 18px #17365d20}.muted{color:var(--m)}.success{width:74px;height:74px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#36ba6d,var(--a));color:#fff;font-size:40px;animation:pop .4s}.row{display:grid;grid-template-columns:240px 1fr 55px;gap:10px;align-items:center;padding:10px;margin:7px 0;background:var(--c);border:1px solid var(--l);border-radius:10px;animation:slide .35s}.bar{height:24px;background:#e7edf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#4f8bd6);animation:grow .9s ease both}@keyframes rise{from{opacity:0;transform:translateY(22px)}}@keyframes pop{from{transform:scale(.4);opacity:0}}@keyframes float{50%{transform:translate(-20px,15px)}}@keyframes slide{from{opacity:0;transform:translateX(-12px)}}@keyframes grow{from{width:0}}@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(prefers-color-scheme:dark){:root{--bg:#0f1722;--c:#172132;--t:#edf3fa;--m:#a8b3c3;--l:#334155}.bar{background:#2a384c}}</style></head><body><header><h1>Dashboard Admin Voting</h1><p>Pantau partisipasi dan kelola putaran pemilihan.</p></header><main class="wrap"><div class="card"><input id="key" type="password" placeholder="ADMIN_KEY"><button id="load">Buka dashboard</button></div><div id="app"></div></main><script>async function api(method,body){let r=await fetch('/api/admin',{method,headers:{'content-type':'application/json','x-admin-key':key.value},body:body?JSON.stringify(body):null}),j=await r.json();if(!r.ok)throw Error(j.error);return j}async function draw(){try{let d=await api('GET');app.innerHTML=`<div class="grid"><div class="card"><small>Eligible</small><h2>22</h2></div><div class="card"><small>Redeem</small><h2>${d.redeemed}</h2></div><div class="card"><small>Suara masuk</small><h2>${d.used}</h2></div></div><div class="card"><h2>Putaran ${d.round} · ${d.open?'Dibuka':'Ditutup'}</h2><button id="toggle">${d.open?'Tutup':'Buka'} voting</button>${d.tied.length>1&&d.tied[0].votes?'<button id="r2">Mulai putaran kedua</button>':''}<p><input id="nim" placeholder="NIM untuk reset"><button id="reset">Reset redeem</button></p>${d.results.map(x=>`<div class="row"><b>${x.name}</b><div class="bar"><i style="width:${d.used?100*x.votes/d.used:0}%"></i></div><b>${x.votes}</b></div>`).join('')}</div>`;toggle.onclick=()=>act({action:'setOpen',value:!d.open});reset.onclick=()=>act({action:'resetNim',nim:nim.value});if(window.r2)r2.onclick=()=>act({action:'startRound2',candidates:d.tied.map(x=>x.nim)})}catch(e){alert(e.message)}}async function act(b){await api('POST',b);draw()}load.onclick=draw;</script></body></html>
