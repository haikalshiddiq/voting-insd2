<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voting InSD2</title><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><style>:root{--b:#17365d;--a:#00a6a6;--bg:#f4f7fb;--c:#fff;--t:#172033;--m:#667085;--l:#d9e2ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px/1.5 system-ui}header{background:linear-gradient(120deg,var(--b),#2873a8);color:#fff;padding:22px}.wrap{max-width:1050px;margin:auto;padding:18px}.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.cand{border:2px solid var(--l);border-radius:10px;padding:12px}.cand:has(input:checked){border-color:var(--a);background:#e9fbfb}input,button{font:inherit;padding:9px;border:1px solid var(--l);border-radius:7px}input[type=text],input[type=password]{width:100%}button{cursor:pointer}.primary{background:var(--a);color:#fff}.muted{color:var(--m)}.hidden{display:none}@media(max-width:650px){.wrap{padding:10px}}</style></head><body><header><h1>Voting Ketua Kelas InSD2</h1><p>22 mahasiswa, Fast-Track dikecualikan</p></header><main class="wrap"><div id="app" class="card">Memuat...</div></main><script>let config,token=localStorage.getItem('ballot')||'',student=JSON.parse(localStorage.getItem('student')||'null'),widget;const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error);return j}function ts(el,cb){let go=()=>{widget=turnstile.render(el,{sitekey:config.siteKey,callback:cb,theme:'auto'})};window.turnstile?go():setTimeout(()=>ts(el,cb),250)}async function init(){config=await api('/api/config');token&&student?vote():redeem()}function redeem(){app.innerHTML=`<h2>Redeem NIM</h2><p class="muted">Satu NIM hanya dapat diredeem satu kali.</p><form id="f"><input id="nim" type="text" inputmode="numeric" maxlength="11" required placeholder="Masukkan NIM"><div id="turn"></div><button class="primary" disabled>Redeem</button></form>`;let tt='';ts('#turn',x=>{tt=x;f.querySelector('button').disabled=false});f.onsubmit=async e=>{e.preventDefault();try{let x=await api('/api/redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nim:nim.value.trim(),turnstileToken:tt})});token=x.token;student=x.student;localStorage.ballot=token;localStorage.student=JSON.stringify(student);vote()}catch(x){alert(x.message);turnstile.reset(widget)}}}function vote(){app.innerHTML=`<h2>Halo, ${esc(student.name)}</h2><form id="f"><div class="grid">${config.candidates.map(c=>`<label class="cand"><input type="radio" name="candidate" value="${c.nim}" required> <b>${esc(c.name)}</b><br><small>${c.nim}</small></label>`).join('')}</div><div id="turn"></div><button class="primary" disabled>Kirim suara</button></form>`;let tt='';ts('#turn',x=>{tt=x;f.querySelector('button').disabled=false});f.onsubmit=async e=>{e.preventDefault();if(!confirm('Pilihan tidak dapat diubah. Kirim?'))return;try{await api('/api/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,candidateNim:new FormData(f).get('candidate'),turnstileToken:tt})});localStorage.removeItem('ballot');localStorage.removeItem('student');app.innerHTML='<h2>Suara berhasil dicatat</h2><p>Hasil hanya dapat dilihat admin.</p>'}catch(x){alert(x.message);turnstile.reset(widget)}}}init().catch(x=>app.textContent=x.message);</script></body></html>
