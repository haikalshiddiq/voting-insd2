<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voting InSD2</title><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><style>:root{--n:#17365d;--a:#00a6a6;--bg:#f3f7fb;--c:#fff;--t:#172033;--m:#667085;--l:#d8e2ec}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 8%,#00a6a61c,transparent 30%),radial-gradient(circle at 90% 18%,#4f8bd622,transparent 34%),var(--bg);color:var(--t);font:15px/1.5 system-ui;overflow-x:hidden}header{position:relative;overflow:hidden;background:linear-gradient(120deg,var(--n),#2873a8);color:#fff;padding:28px}header:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff12;right:-60px;top:-110px;animation:float 8s ease-in-out infinite}.wrap{max-width:1080px;margin:auto;padding:18px}.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 18px 46px #17365d16;animation:rise .55s ease both}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px}.cand{position:relative;border:2px solid var(--l);border-radius:12px;padding:13px;transition:.2s;cursor:pointer}.cand:hover{transform:translateY(-4px);box-shadow:0 10px 24px #17365d1c}.cand:has(input:checked){border-color:var(--a);box-shadow:0 0 0 4px #00a6a62e}.cand:has(input:checked):after{content:'✓';position:absolute;right:10px;top:9px;background:var(--a);color:#fff;width:27px;height:27px;border-radius:50%;display:grid;place-items:center;animation:pop .25s}input,button{font:inherit;padding:10px;border:1px solid var(--l);border-radius:8px}input[type=text],input[type=password]{width:100%}button{cursor:pointer;transition:.16s}.primary,#load{background:linear-gradient(135deg,var(--a),#087e9d);color:#fff;border:0}button:hover{transform:translateY(-2px);box-shadow:0 8px 18px #17365d20}.muted{color:var(--m)}.success{width:74px;height:74px;margin:auto;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#36ba6d,var(--a));color:#fff;font-size:40px;animation:pop .4s}.row{display:grid;grid-template-columns:240px 1fr 55px;gap:10px;align-items:center;padding:10px;margin:7px 0;background:var(--c);border:1px solid var(--l);border-radius:10px;animation:slide .35s}.bar{height:24px;background:#e7edf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#4f8bd6);animation:grow .9s ease both}@keyframes rise{from{opacity:0;transform:translateY(22px)}}@keyframes pop{from{transform:scale(.4);opacity:0}}@keyframes float{50%{transform:translate(-20px,15px)}}@keyframes slide{from{opacity:0;transform:translateX(-12px)}}@keyframes grow{from{width:0}}@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(prefers-color-scheme:dark){:root{--bg:#0f1722;--c:#172132;--t:#edf3fa;--m:#a8b3c3;--l:#334155}.bar{background:#2a384c}}</style></head><body><header><h1>Voting Ketua Kelas InSD2</h1><p>Suara Anda, arah kelas kita.</p></header><main class="wrap"><div id="app" class="card"><h2>Menyiapkan voting...</h2></div></main><script>let C,T=localStorage.ballot||'',S=JSON.parse(localStorage.student||'null'),W;const E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error);return j}function ts(el,cb){let f=()=>W=turnstile.render(el,{sitekey:C.siteKey,callback:cb,theme:'auto'});window.turnstile?f():setTimeout(()=>ts(el,cb),250)}async function init(){C=await api('/api/config');T&&S?vote():redeem()}function redeem(){app.innerHTML=`<h2>Redeem hak voting</h2><p class="muted">Masukkan NIM Anda. Mahasiswa Fast-Track tidak termasuk pemilih.</p><form id="f"><input id="nim" inputmode="numeric" maxlength="11" placeholder="Masukkan NIM" required><div id="turn"></div><button class="primary" disabled>Redeem dan lanjut</button></form>`;let z='';ts('#turn',x=>{z=x;f.querySelector('button').disabled=false});f.onsubmit=async e=>{e.preventDefault();try{let x=await api('/api/redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nim:nim.value.trim(),turnstileToken:z})});T=x.token;S=x.student;localStorage.ballot=T;localStorage.student=JSON.stringify(S);vote()}catch(x){alert(x.message);turnstile.reset(W)}}}function vote(){app.innerHTML=`<h2>Halo, ${E(S.name)}</h2><p class="muted">Pilih satu kandidat. Pilihan tidak dapat diubah setelah dikirim.</p><form id="f"><div class="grid">${C.candidates.map(c=>`<label class="cand"><input type="radio" name="candidate" value="${c.nim}" required> <b>${E(c.name)}</b><br><small>${c.nim}</small></label>`).join('')}</div><div id="turn"></div><button class="primary" disabled>Kirim suara</button></form>`;let z='';ts('#turn',x=>{z=x;f.querySelector('button').disabled=false});f.onsubmit=async e=>{e.preventDefault();if(!confirm('Kirim pilihan ini?'))return;try{await api('/api/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:T,candidateNim:new FormData(f).get('candidate'),turnstileToken:z})});localStorage.clear();app.innerHTML='<div class="success">✓</div><h2 style="text-align:center">Suara berhasil dicatat</h2><p class="muted" style="text-align:center">Terima kasih telah berpartisipasi.</p>'}catch(x){alert(x.message);turnstile.reset(W)}}}init().catch(x=>app.textContent=x.message);</script></body></html>
