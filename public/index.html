<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voting Ketua Kelas InSD2</title><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><style>:root{--navy:#102f56;--blue:#266b9c;--teal:#00a6a6;--bg:#f5f8fc;--card:#fff;--text:#172033;--muted:#65748b;--line:#dbe5ef;--ok:#1f9d55;--danger:#ca3d3d;--shadow:0 18px 45px rgba(16,47,86,.11)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 4%,rgba(0,166,166,.12),transparent 28%),radial-gradient(circle at 92% 14%,rgba(38,107,156,.14),transparent 34%),var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}header{position:relative;overflow:hidden;background:linear-gradient(125deg,var(--navy),var(--blue));color:#fff;padding:26px 22px}header:after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:#ffffff12;right:-50px;top:-110px;animation:float 9s ease-in-out infinite}.header-inner,.wrap{max-width:1120px;margin:auto}.header-inner{display:flex;justify-content:space-between;gap:18px;align-items:center;position:relative;z-index:1}.clock{text-align:right;font-variant-numeric:tabular-nums}.clock b{display:block;font-size:18px}.wrap{padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;box-shadow:var(--shadow);animation:rise .48s ease both}.stepper{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.step{padding:10px;border-radius:10px;background:#eaf0f6;color:var(--muted);font-weight:700;text-align:center}.step.on{background:linear-gradient(135deg,var(--teal),#168bb0);color:#fff}.countdown{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.timebox{min-width:74px;text-align:center;padding:9px;background:#eef6f8;border-radius:12px}.timebox b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.notice{padding:12px;border-radius:12px;background:#fff7df;border:1px solid #eed58e}.actions{display:flex;gap:9px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:11px}.candidate{position:relative;border:2px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.2s;background:linear-gradient(145deg,var(--card),rgba(0,166,166,.025))}.candidate:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(16,47,86,.12)}.candidate:has(input:checked){border-color:var(--teal);box-shadow:0 0 0 4px rgba(0,166,166,.18)}.candidate:has(input:checked):after{content:'✓';position:absolute;right:10px;top:9px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:#fff;animation:pop .25s}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.userchip{padding:8px 12px;border-radius:999px;background:#e9f8f7;color:#08716f;font-weight:700}input,button{font:inherit;padding:10px 12px;border:1px solid #bccbd9;border-radius:9px}input[type=text],input[type=password]{width:100%}button{cursor:pointer;background:#fff;transition:.16s}.primary{background:linear-gradient(135deg,var(--teal),#087f9d);color:#fff;border:0}.danger{color:#fff;background:linear-gradient(135deg,#d94b4b,#b52f2f);border:0}.ghost{background:transparent}button:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(16,47,86,.13)}button:disabled{opacity:.5;cursor:not-allowed;transform:none}.muted{color:var(--muted)}.success{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:auto;background:linear-gradient(135deg,#35b96d,var(--teal));color:#fff;font-size:40px;animation:pop .4s}.row{display:grid;grid-template-columns:240px 1fr 58px;gap:10px;align-items:center;padding:10px;margin:7px 0;border:1px solid var(--line);border-radius:11px}.bar{height:24px;background:#e7edf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#4f8bd6);animation:grow .8s ease both}@keyframes rise{from{opacity:0;transform:translateY(18px)}}@keyframes pop{from{opacity:0;transform:scale(.45)}}@keyframes float{50%{transform:translate(-18px,14px)}}@keyframes grow{from{width:0}}@media(max-width:680px){.header-inner{align-items:flex-start;flex-direction:column}.clock{text-align:left}.stepper{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:10px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(prefers-color-scheme:dark){:root{--bg:#0f1722;--card:#172132;--text:#edf3fa;--muted:#a8b3c3;--line:#334155}.step{background:#26364b}.timebox{background:#20364a}.notice{background:#3d321a;border-color:#66572d}.userchip{background:#123e46;color:#9ce5df}.bar{background:#2a384c}}</style></head><body><header><div class="header-inner"><div><h1>Voting Ketua Kelas InSD2</h1><p>Proses singkat, aman, dan transparan.</p></div><div class="clock"><span>Waktu server WIB</span><b id="serverClock">--:--:--</b></div></div></header><main class="wrap"><div id="countCard" class="card"><b>Batas akhir: Rabu, 11 November 2026 · 20.00 WIB</b><div class="countdown" id="countdown"></div></div><div class="stepper"><div id="s1" class="step on">1. Validasi NIM</div><div id="s2" class="step">2. Pilih kandidat</div><div id="s3" class="step">3. Konfirmasi</div></div><section id="app" class="card"><h2>Menyiapkan halaman...</h2></section></main><script>let C,T=localStorage.getItem('ballot')||'',S=JSON.parse(localStorage.getItem('student')||'null'),W,offset=0;const E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.error);return j}function sync(t){offset=Date.parse(t)-Date.now()}function tick(){let now=new Date(Date.now()+offset);serverClock.textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);if(!C)return;let d=Math.max(0,Date.parse(C.deadline)-now),v=[['Hari',Math.floor(d/86400000)],['Jam',Math.floor(d/3600000)%24],['Menit',Math.floor(d/60000)%60],['Detik',Math.floor(d/1000)%60]];countdown.innerHTML=v.map(x=>`<div class="timebox"><b>${String(x[1]).padStart(2,'0')}</b><span>${x[0]}</span></div>`).join('');if(d===0)countCard.classList.add('notice')}setInterval(tick,1000);function steps(n){[s1,s2,s3].forEach((x,i)=>x.classList.toggle('on',i<n))}function ts(el,cb){let f=()=>W=turnstile.render(el,{sitekey:C.siteKey,callback:cb,theme:'auto'});window.turnstile?f():setTimeout(()=>ts(el,cb),200)}async function init(){C=await api('/api/config');sync(C.serverTime);tick();if(!C.open&&!T)return closed();T&&S?vote():redeem()}function closed(){steps(0);app.innerHTML='<h2>Voting telah ditutup</h2><p class="muted">Batas waktu sudah berakhir atau voting ditutup oleh admin.</p>'}function redeem(){steps(1);app.innerHTML=`<h2>Validasi hak pilih</h2><p class="muted">Masukkan NIM untuk memulai sesi voting. NIM Fast-Track tidak termasuk daftar pemilih.</p><form id="f"><label for="nim"><b>NIM mahasiswa</b></label><input id="nim" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="Contoh: 25120400006" required><div id="turn"></div><div class="actions"><button class="primary" disabled>Validasi dan lanjut</button></div></form><p class="notice"><b>Privasi:</b> NIM digunakan untuk memverifikasi hak pilih. Pilihan suara disimpan terpisah.</p>`;let z='';ts('#turn',x=>{z=x;f.querySelector('button').disabled=false});f.onsubmit=async e=>{e.preventDefault();try{let x=await api('/api/redeem',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({nim:nim.value.trim(),turnstileToken:z})});T=x.token;S=x.student;localStorage.setItem('ballot',T);localStorage.setItem('student',JSON.stringify(S));sync(x.serverTime);vote()}catch(x){alert(x.message);turnstile.reset(W)}}}async function logout(){if(!confirm('Keluar dan batalkan sesi? Anda dapat login kembali dengan NIM yang sama selama belum memilih.'))return;try{await api('/api/logout',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:T})});localStorage.removeItem('ballot');localStorage.removeItem('student');T='';S=null;redeem()}catch(x){alert(x.message)}}function vote(){steps(2);app.innerHTML=`<div class="toolbar"><div><h2>Pilih ketua kelas</h2><span class="userchip">${E(S.name)} · ${E(S.nim)}</span></div><button id="logout" class="danger">Keluar & batalkan sesi</button></div><p class="muted">Pilih tepat satu kandidat. Periksa kembali sebelum menekan Kirim Suara.</p><form id="f"><div class="grid">${C.candidates.map(c=>`<label class="candidate"><input type="radio" name="candidate" value="${c.nim}" required> <b>${E(c.name)}</b><br><small>NIM ${c.nim}</small></label>`).join('')}</div><div id="turn"></div><div class="actions"><button class="primary" disabled>Kirim suara</button></div></form>`;logout.onclick=window.logout;let z='';ts('#turn',x=>{z=x;f.querySelector('.primary').disabled=false});f.onsubmit=async e=>{e.preventDefault();let nim=new FormData(f).get('candidate'),c=C.candidates.find(x=>x.nim===nim);if(!confirm(`Konfirmasi pilihan Anda:
${c.name}

Pilihan tidak dapat diubah.`))return;try{await api('/api/vote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:T,candidateNim:nim,turnstileToken:z})});localStorage.removeItem('ballot');localStorage.removeItem('student');steps(3);app.innerHTML='<div class="success">✓</div><h2 style="text-align:center">Suara berhasil dicatat</h2><p class="muted" style="text-align:center">Terima kasih telah berpartisipasi. Anda dapat menutup halaman ini.</p>'}catch(x){alert(x.message);turnstile.reset(W)}}}window.logout=logout;init().catch(x=>app.innerHTML=`<h2>Terjadi kendala</h2><p>${E(x.message)}</p>`);</script></body></html>
